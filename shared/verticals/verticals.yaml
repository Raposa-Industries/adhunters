# The verticals Spy sorts creatives into, grouped by category.
#
# This is the whole list: a classifier (keyword rules or a model) may only
# answer with an id from this file, or with nothing. It never makes up a name.
#
# Fields:
#   id        never changes once used; stored with each creative.
#   name      what people see. Short and plain: two words or so, 20 characters at most.
#   covers    what belongs here, in a line. Read by people and by a model.
#   not       near neighbours that do NOT belong here: what, and the vertical
#             it goes to instead (goes), when there is one.
#   keywords  name the vertical on their own.
#   hints     only help when something else points the same way.
#   catch_all used only when no other vertical of its category matches.
#
# Keywords and hints are lowercase words or phrases of up to 4 words, matched
# as whole words. A trailing * matches any ending ("diabet*" = diabetes,
# diabetic); plurals in s/es always match. Each one appears once in the file.
#
# Most keywords come from the old Spy's rules (collector migrations 023 and 030).

categories:
  - id: heart
    name: Heart
    verticals:
      - id: blood-pressure
        name: Blood Pressure
        covers: High blood pressure and hypertension offers.
        not:
          - {what: "Cholesterol or clogged arteries with no blood pressure claim", goes: cholesterol}
          - {what: "Swollen legs, varicose veins, compression socks", goes: circulation}
        keywords: [blood pressure, hypertension, high bp, bp support]
        hints: [heart attack, stroke]
      - id: cholesterol
        name: Cholesterol
        covers: Cholesterol, clogged arteries and general heart health.
        not:
          - {what: "Blood pressure claims, even with cholesterol beside them", goes: blood-pressure}
        keywords: [cholesterol, clogged arteries, artery, arteries, heart health, cardiovascular, plaque buildup]
        hints: [heart, ldl]
      - id: circulation
        name: Circulation
        covers: Poor circulation in the legs and feet, swelling, varicose veins, compression socks.
        not:
          - {what: "Burning or tingling feet from nerve damage", goes: neuropathy}
          - {what: "Foot or heel pain, orthopedic shoes", goes: foot-pain}
        keywords: [poor circulation, compression sock*, swollen leg*, leg swelling, puffy leg*, heavy legs, varicose vein*, blood flow]
        hints: [circulation, swelling]

  - id: metabolism
    name: Metabolism
    verticals:
      - id: weight-loss
        name: Weight Loss
        covers: Losing weight with supplements, diets and programs (not prescription drugs).
        not:
