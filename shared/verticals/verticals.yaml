          - {what: "Blood sugar claims with weight as a side effect", goes: diabetes}
        keywords: [weight loss, lose weight, losing weight, belly fat, fat burn*, slimming, obesity, keto, ketogenic, metabolism]
        hints: [appetite, cravings, diet, dieting, waistline, lbs, overweight]
      - id: glp-1
        name: GLP-1
        covers: Prescription weight loss drugs and the telehealth offers selling them, and "natural GLP-1" supplements.
        not:
          - {what: "Weight loss supplements that never mention GLP-1 or a drug", goes: weight-loss}
        keywords: [glp-1, glp1, semaglutide, tirzepatide, ozempic, wegovy, mounjaro, zepbound, compounded semaglutide]
        hints: [prescription weight loss, weight loss injection*, weight loss shot*]
      - id: diabetes
        name: Diabetes
        covers: Blood sugar, type 2 diabetes, prediabetes and insulin resistance.
        not:
          - {what: "Nerve pain in diabetics' feet", goes: neuropathy}
          - {what: "Eye damage from diabetes, retinopathy", goes: vision}
        keywords: [blood sugar, blood glucose, diabet*, a1c, insulin resistance, type 2]
        hints: [glucose, insulin, prediabet*]

