# promtool test rules platform/observe/tests/rules_test.yaml
# Checks the rules that page, and the generic ones, against made-up series.
rule_files:
  - ../rules/collection.yaml
  - ../rules/services.yaml
  - ../rules/boxes.yaml
  - ../rules/credits.yaml
  - ../rules/funnels.yaml
  - ../rules/raposa.yaml

evaluation_interval: 1m

tests:
  # Capture scrapes fine for 10 minutes, then its series vanish (the process
  # died): CaptureStopped must page once the 5-minute rate window and the
  # 3 minutes of "for" have passed.
  - interval: 1m
    input_series:
      - series: 'tracks_capture_scrapes_total{network="taboola",publisher="p1",device="mobile",outcome="ok",instance="a",box="worker"}'
        values: '0+240x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: CaptureStopped
        exp_alerts: []
      - eval_time: 25m
        alertname: CaptureStopped
        exp_alerts:
          - exp_labels:
              tier: page
            exp_annotations:
              summary: No successful scrape on any box for 3 minutes. Collection is stopped.
              resolved: Scrapes are succeeding again. Collection is running.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/capture-stopped.md

  # Scrapes still come in, but every one fails: that is stopped too.
  - interval: 1m
    input_series:
      - series: 'tracks_capture_scrapes_total{network="taboola",publisher="p1",device="mobile",outcome="ok",instance="a",box="worker"}'
        values: '0+240x10 2400x20'
      - series: 'tracks_capture_scrapes_total{network="taboola",publisher="p1",device="mobile",outcome="http_403",instance="a",box="worker"}'
        values: '0x10 0+240x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: CaptureStopped
        exp_alerts:
          - exp_labels:
              tier: page
            exp_annotations:
              summary: No successful scrape on any box for 3 minutes. Collection is stopped.
              resolved: Scrapes are succeeding again. Collection is running.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/capture-stopped.md

  # The data box stops sending; the worker box keeps going.
  - interval: 1m
    input_series:
      - series: 'node_boot_time_seconds{box="data",instance="adhunters-data"}'
        values: '1000x30'
      - series: 'node_boot_time_seconds{box="worker",instance="adhunters-worker"}'
        values: '1000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: BoxGone
        exp_alerts: []
      - eval_time: 40m
        alertname: BoxGone
        exp_alerts:
          - exp_labels:
              tier: page
              box: data
            exp_annotations:
              summary: The data box has sent no metrics for over 5 minutes.
              resolved: The data box is sending metrics again.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/box-gone.md

  # A task that promised every 10 minutes last succeeded at minute 0.
  - interval: 1m
    input_series:
      - series: 'adhunters_task_last_success_timestamp_seconds{service="tracks-loader",task="hour_close",instance="adhunters-data",box="data"}'
        values: '0x30'
      - series: 'adhunters_task_promise_seconds{service="tracks-loader",task="hour_close",instance="adhunters-data",box="data"}'
        values: '600x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: TaskLate
        exp_alerts: []
      - eval_time: 11m
        alertname: TaskLate
        exp_alerts:
          - exp_labels:
              tier: chat
              service: tracks-loader
              task: hour_close
              instance: adhunters-data
              box: data
            exp_annotations:
              summary: tracks-loader task hour_close last succeeded 11m 0s ago, later than it promises.
              resolved: tracks-loader task hour_close is succeeding on time again.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/task-late.md

  # The newest backup finished at time 0; the check runs 27 hours later.
  - interval: 1h
    input_series:
      - series: 'pgbackrest_last_backup_timestamp_seconds{type="diff",box="data"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupLate
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupLate
        exp_alerts:
          - exp_labels:
              tier: page
            exp_annotations:
              summary: The newest database backup finished 1d 3h 0m 0s ago.
              resolved: A new database backup has finished.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/backup-late.md

  # Residential traffic drains slowly (0.03 GB an hour from 3 GB): under
  # the 2 GB warning after 33 hours, but far from empty, so only a chat
  # alert. fal drains fast (1.20 USD an hour from 30): under its 20 USD
  # warning after 8 hours and gone within a day, so it pages too.
  - interval: 1m
    input_series:
      - series: 'adhunters_credit_remaining{credit="iproyal",unit="GB",service="observe-bot",instance="adhunters-data",box="data"}'
        values: '3-0.0005x2400'
      - series: 'adhunters_credit_warn{credit="iproyal",unit="GB",service="observe-bot",instance="adhunters-data",box="data"}'
        values: '2x2400'
      - series: 'adhunters_credit_remaining{credit="fal",unit="USD",service="observe-bot",instance="adhunters-data",box="data"}'
        values: '30-0.02x700'
      - series: 'adhunters_credit_warn{credit="fal",unit="USD",service="observe-bot",instance="adhunters-data",box="data"}'
        values: '20x700'
    alert_rule_test:
      - eval_time: 8h
        alertname: CreditLow
        exp_alerts: []
      - eval_time: 10h
        alertname: CreditLow
        exp_alerts:
          - exp_labels:
              tier: chat
              credit: fal
              unit: USD
              service: observe-bot
              instance: adhunters-data
              box: data
            exp_annotations:
              summary: fal is down to 18.0 USD, under its warning level. Top it up.
              resolved: fal is back above its warning level.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/credit-low.md
      - eval_time: 10h
        alertname: CreditRunningOut
        exp_alerts:
          - exp_labels:
              tier: page
              credit: fal
              unit: USD
              service: observe-bot
              instance: adhunters-data
              box: data
            exp_annotations:
              summary: fal runs out within a day at the current rate (18.0 USD left). Top it up now.
              resolved: fal is no longer set to run out within a day.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/credit-low.md
      - eval_time: 36h
        alertname: CreditLow
        exp_alerts:
          - exp_labels:
              tier: chat
              credit: iproyal
              unit: GB
              service: observe-bot
              instance: adhunters-data
              box: data
            exp_annotations:
              summary: iproyal is down to 1.9 GB, under its warning level. Top it up.
              resolved: iproyal is back above its warning level.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/credit-low.md
      - eval_time: 36h
        alertname: CreditRunningOut
        exp_alerts: []

  # A monthly renewal due at 10 days (864000 s) with a 7-day reminder.
  - interval: 1h
    input_series:
      - series: 'adhunters_renewal_due_timestamp_seconds{renewal="proxies-datacenter",service="observe-bot",instance="adhunters-data",box="data"}'
        values: '864000x300'
      - series: 'adhunters_renewal_remind_seconds{renewal="proxies-datacenter",service="observe-bot",instance="adhunters-data",box="data"}'
        values: '604800x300'
    alert_rule_test:
      - eval_time: 2d
        alertname: RenewalDue
        exp_alerts: []
      - eval_time: 4d
        alertname: RenewalDue
        exp_alerts:
          - exp_labels:
              tier: chat
              renewal: proxies-datacenter
              service: observe-bot
              instance: adhunters-data
              box: data
            exp_annotations:
              summary: proxies-datacenter renews or must be paid in 6d 0h 0m 0s. Check the card or the balance behind it.
              resolved: proxies-datacenter is no longer due soon (paid, renewed, or its date moved).
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/renewal-due.md

  # A service is refused for lack of credit once at 30m: the new counter
  # pages at once, and the page clears 10 minutes after the last refusal.
  - interval: 1m
    input_series:
      - series: 'adhunters_out_of_credit_total{provider="openai",service="forge-api",instance="adhunters-data",box="data"}'
        values: '_x30 1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: OutOfCredit
        exp_alerts:
          - exp_labels:
              tier: page
              provider: openai
              service: forge-api
              instance: adhunters-data
              box: data
            exp_annotations:
              summary: openai refused forge-api for lack of credit (1 calls in 10 minutes). Work that needs it has stopped.
              resolved: openai has stopped refusing forge-api for lack of credit.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/out-of-credit.md
      - eval_time: 45m
        alertname: OutOfCredit
        exp_alerts: []

  # The edge's spool refuses a write, then recovers after 3 minutes: a page
  # only once it has failed for 2 minutes, and none after it recovers.
  - interval: 1m
    input_series:
      - series: 'funnels_edge_spool_failing{service="funnels-edge",instance="adhunters-data"}'
        values: '0x5 1x3 0x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: FunnelsSpoolFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: FunnelsSpoolFailing
        exp_alerts:
          - exp_labels:
              tier: page
            exp_annotations:
              summary: funnels-edge cannot write beacons to its spool; visitor events are being lost.
              resolved: funnels-edge is writing beacons to its spool again.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/funnels-spool-failing.md
      - eval_time: 11m
        alertname: FunnelsSpoolFailing
        exp_alerts: []

  # spy-numbers' [direction] fails at minutes 20, 40 and 60 and succeeds in
  # between, so it is never late: TaskFailing fires on the third failure.
  - interval: 1m
    input_series:
      - series: 'adhunters_task_runs_total{service="spy-numbers",task="direction",result="error",instance="adhunters-data",box="data",job="adhunters"}'
        values: '0x19 1x19 2x19 3x200'
      - series: 'adhunters_task_runs_total{service="spy-numbers",task="direction",result="ok",instance="adhunters-data",box="data",job="adhunters"}'
        values: '0+1x260'
    alert_rule_test:
      - eval_time: 59m
        alertname: TaskFailing
        exp_alerts: []
      - eval_time: 61m
        alertname: TaskFailing
        exp_alerts:
          - exp_labels:
              tier: chat
              service: spy-numbers
              task: direction
              box: data
            exp_annotations:
              summary: spy-numbers task direction on the data box failed 3 times in the last 2 hours.
              resolved: spy-numbers task direction on the data box has stopped failing.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/task-failing.md
      - eval_time: 61m
        alertname: TaskLate
        exp_alerts: []
      - eval_time: 3h30m
        alertname: TaskFailing
        exp_alerts: []

  # tracks-walker logs the same error every minute (archiving raw walk files,
  # 2 Oct 2026); create logs one error twice. Only the first fires.
  - interval: 1m
    input_series:
      - series: 'adhunters_log_errors_total{service="tracks-walker",msg="archiving raw walk files",instance="adhunters-worker",box="worker",job="adhunters"}'
        values: '0+1x60'
      - series: 'adhunters_log_errors_total{service="create",msg="create work",instance="adhunters-data",box="data",job="adhunters"}'
        values: '0x10 1x10 2x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: ErrorsLogged
        exp_alerts:
          - exp_labels:
              tier: chat
              service: tracks-walker
              msg: archiving raw walk files
              box: worker
            exp_annotations:
              summary: tracks-walker on the worker box logged "archiving raw walk files" 30 times in the last hour.
              resolved: tracks-walker on the worker box has stopped logging "archiving raw walk files" over and over.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/errors-logged.md

  # Postgres restarts at minute 31 (its unit's start time moves); the alert
  # holds for the hour after.
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_start_time_seconds{name="postgresql@17-main.service",instance="adhunters-data",box="data",job="node"}'
        values: '1000x30 5000x120'
      - series: 'node_systemd_unit_start_time_seconds{name="alloy.service",instance="adhunters-data",box="data",job="node"}'
        values: '900x30 4000x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresRestarted
        exp_alerts: []
      - eval_time: 40m
        alertname: PostgresRestarted
        exp_alerts:
          - exp_labels:
              tier: chat
              name: postgresql@17-main.service
              instance: adhunters-data
              box: data
              job: node
            exp_annotations:
              summary: Postgres (postgresql@17-main.service) on the data box restarted in the last hour. Services lost their connections for a few seconds and logged errors.
              resolved: No Postgres restart on the data box in the last hour.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/postgres-restarted.md
      - eval_time: 2h
        alertname: PostgresRestarted
        exp_alerts: []

  # raposa-engine works for an hour, then takes no step: the window needs 3
  # quiet hours and the rule 3 more.
  - interval: 1m
    input_series:
      - series: 'up{job="adhunters",service="raposa-engine",instance="adhunters-worker",box="worker"}'
        values: '1x500'
      - series: 'raposa_steps_total{result="visit",service="raposa-engine",instance="adhunters-worker",box="worker",job="adhunters"}'
        values: '0+5x60 300x440'
    alert_rule_test:
      - eval_time: 6h55m
        alertname: RaposaIdle
        exp_alerts: []
      - eval_time: 7h05m
        alertname: RaposaIdle
        exp_alerts:
          - exp_labels:
              tier: chat
            exp_annotations:
              summary: raposa-engine has taken no investigation step for over 3 hours. Nothing is queued, or nothing that is queued runs.
              resolved: raposa-engine is running investigations again.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/raposa-idle.md

  # An engine that never took a step since it started has no steps series at
  # all (2 Oct 2026); one that is down is ServiceDown, not this.
  - interval: 1m
    input_series:
      - series: 'up{job="adhunters",service="raposa-engine",instance="adhunters-worker",box="worker"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 2h50m
        alertname: RaposaIdle
        exp_alerts: []
      - eval_time: 3h05m
        alertname: RaposaIdle
        exp_alerts:
          - exp_labels:
              tier: chat
            exp_annotations:
              summary: raposa-engine has taken no investigation step for over 3 hours. Nothing is queued, or nothing that is queued runs.
              resolved: raposa-engine is running investigations again.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/raposa-idle.md
  - interval: 1m
    input_series:
      - series: 'up{job="adhunters",service="raposa-engine",instance="adhunters-worker",box="worker"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: RaposaIdle
        exp_alerts: []

  # The walker walks for 30 minutes and stops.
  - interval: 1m
    input_series:
      - series: 'tracks_walker_walks_total{outcome="ok",step="none",service="tracks-walker",instance="adhunters-worker",box="worker",job="adhunters"}'
        values: '0+40x30 1200x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: WalkerStopped
        exp_alerts: []
      - eval_time: 62m
        alertname: WalkerStopped
        exp_alerts:
          - exp_labels:
              tier: chat
            exp_annotations:
              summary: tracks-walker has walked no landing page for 30 minutes.
              resolved: tracks-walker is walking landing pages again.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/walker-stopped.md

  # A quarter of walks fail: WalkerFailing. 8% is a normal day: nothing.
  - interval: 1m
    input_series:
      - series: 'tracks_walker_walks_total{outcome="ok",step="none",service="tracks-walker",instance="adhunters-worker",box="worker",job="adhunters"}'
        values: '0+90x120'
      - series: 'tracks_walker_walks_total{outcome="http_error",step="none",service="tracks-walker",instance="adhunters-worker",box="worker",job="adhunters"}'
        values: '0+30x120'
      - series: 'tracks_walker_walks_total{outcome="ok",step="none",service="tracks-walker",instance="adhunters-standby",box="standby",job="adhunters"}'
        values: '0+92x120'
      - series: 'tracks_walker_walks_total{outcome="http_error",step="none",service="tracks-walker",instance="adhunters-standby",box="standby",job="adhunters"}'
        values: '0+8x120'
    alert_rule_test:
      - eval_time: 25m
        alertname: WalkerFailing
        exp_alerts: []
      - eval_time: 35m
        alertname: WalkerFailing
        exp_alerts:
          - exp_labels:
              tier: chat
              box: worker
            exp_annotations:
              summary: 25% of walks on the worker box failed in the last hour (pages refusing, proxy lines blocked, or timeouts).
              resolved: Walks on the worker box fail at their usual rate again.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/walker-failing.md

  # The oldest overdue ad goes from 1 hour to over 8 hours late.
  - interval: 1m
    input_series:
      - series: 'tracks_walker_oldest_overdue_seconds{service="tracks-walker",instance="adhunters-worker",box="worker",job="adhunters"}'
        values: '3600x10 30000x60'
    alert_rule_test:
      - eval_time: 35m
        alertname: WalkerBehind
        exp_alerts: []
      - eval_time: 45m
        alertname: WalkerBehind
        exp_alerts:
          - exp_labels:
              tier: chat
              box: worker
            exp_annotations:
              summary: An ad has waited 8h 20m 0s past its re-walk on the worker box. tracks-walker is not keeping up.
              resolved: tracks-walker on the worker box is keeping up with its re-walks again.
              runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/walker-behind.md
