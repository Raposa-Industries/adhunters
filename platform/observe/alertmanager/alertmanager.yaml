# Where alerts go (decision 0004). Loaded into Grafana Cloud's Alertmanager
# by push.sh, which fills the @@NAME@@ values from observe.env.
#
#   tier=page       Telegram "AdHunters alerts", with sound, repeated every
#                   5 minutes until it clears or someone silences it
#   tier=chat       the same group, silent, grouped, at any hour. (Until 2
#                   Oct 2026 chat alerts were held from 22:00 to 08:00 São
#                   Paulo, and one that cleared before 08:00 was never sent.)
#   tier=heartbeat  Better Stack, every minute; when it stops, Better Stack
#                   calls the owner
route:
  receiver: telegram-chat
  group_by: [alertname, box]
  group_wait: 1m
  group_interval: 10m
  repeat_interval: 6h
  routes:
    - matchers: ['tier="heartbeat"']
      receiver: betterstack-heartbeat
      group_by: [alertname]
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['tier="page"']
      receiver: telegram-page
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m
    - matchers: ['tier="chat"']
      receiver: telegram-chat

# A page mutes the chat alerts it explains: while collection is stopped,
# "capture instance quiet" and "loader lag" say nothing new.
inhibit_rules:
  - source_matchers: ['alertname="CaptureStopped"']
    target_matchers: ['alertname=~"CaptureLow|CaptureInstanceQuiet|CaptureErrors|PublisherQuiet|WalkerStopped"']
  - source_matchers: ['alertname="BoxGone"']
    target_matchers: ['tier="chat"']
    equal: [box]
  - source_matchers: ['alertname="PostgresDown"']
    target_matchers: ['alertname=~"LoaderLag|HourNotClosed|ServiceDown|ServiceRestarting|TaskLate|TaskFailing|ErrorsLogged|WalkerStopped|RaposaIdle|RaposaQueueEmpty"']
  # Every service logs connection errors while Postgres restarts; the restart
  # is the one message worth reading. Errors that go on after the hour fire
  # then.
  - source_matchers: ['alertname="PostgresRestarted"']
    target_matchers: ['alertname="ErrorsLogged"']
  # An empty automatic queue is why Raposa is idle; say the cause once.
  - source_matchers: ['alertname="RaposaQueueEmpty"']
    target_matchers: ['alertname="RaposaIdle"']
  # A failing task logs an error each time; the task's alert says it once.
  - source_matchers: ['alertname="TaskFailing"']
    target_matchers: ['alertname="ErrorsLogged"']
    equal: [service, box]

receivers:
  - name: telegram-page
    telegram_configs:
      - bot_token: '@@TELEGRAM_BOT_TOKEN@@'
        chat_id: @@TELEGRAM_CHAT_ID@@
        parse_mode: HTML
        disable_notifications: false
        send_resolved: true
        message: '{{ template "adhunters.telegram" . }}'
  - name: telegram-chat
    telegram_configs:
      - bot_token: '@@TELEGRAM_BOT_TOKEN@@'
        chat_id: @@TELEGRAM_CHAT_ID@@
        parse_mode: HTML
        disable_notifications: true
        send_resolved: true
        message: '{{ template "adhunters.telegram" . }}'
  - name: betterstack-heartbeat
    webhook_configs:
      - url: '@@BETTERSTACK_HEARTBEAT_URL@@'
        send_resolved: false

templates:
  - telegram.tmpl
