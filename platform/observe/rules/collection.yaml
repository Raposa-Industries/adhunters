# Alerts for collection (tracks). Every rule has a tier label (page, chat)
# and a runbook in runbooks/<name>.md. Pushed to Grafana Cloud with
# platform/observe/push.sh; see platform/observe/README.md.
groups:
  - name: collection
    interval: 1m
    rules:
      - alert: CaptureStopped
        # No successful scrape anywhere. "or vector(0)" makes a capture that
        # died completely (no series at all) count as zero.
        expr: (sum(rate(tracks_capture_scrapes_total{outcome="ok"}[5m])) or vector(0)) == 0
        for: 3m
        labels:
          tier: page
        annotations:
          summary: No successful scrape on any box for 3 minutes. Collection is stopped.
          resolved: Scrapes are succeeding again. Collection is running.
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/capture-stopped.md

      - alert: CaptureLow
        # Usual is the same ten minutes a week ago.
        expr: |
          sum(rate(tracks_capture_scrapes_total{outcome="ok"}[10m]))
            < 0.7 * sum(rate(tracks_capture_scrapes_total{outcome="ok"}[10m] offset 1w))
        for: 10m
        labels:
          tier: page
        annotations:
          summary: 'Successful scrapes are at {{ $value | humanize }} a second, under 70% of the same time last week, for 10 minutes.'
          resolved: 'Successful scrapes are back near last week''s rate.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/capture-low.md

      - alert: CaptureInstanceQuiet
        expr: time() - tracks_capture_last_write_timestamp_seconds > 180
        for: 2m
        labels:
          tier: chat
        annotations:
          summary: 'Capture {{ $labels.instance }} on the {{ $labels.box }} box has written nothing to its spool for {{ $value | humanizeDuration }}.'
          resolved: 'Capture {{ $labels.instance }} on the {{ $labels.box }} box is writing to its spool again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/capture-instance-quiet.md

      - alert: CaptureErrors
        expr: |
          sum by (network) (rate(tracks_capture_scrapes_total{outcome!~"ok|empty"}[15m]))
            / sum by (network) (rate(tracks_capture_scrapes_total[15m])) > 0.3
        for: 15m
        labels:
          tier: chat
        annotations:
          summary: '{{ $value | humanizePercentage }} of {{ $labels.network }} scrapes are failing (timeouts, blocks, errors).'
          resolved: '{{ $labels.network }} scrape failures are back to normal.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/capture-errors.md

      - alert: PublisherQuiet
        # A publisher and device answering with ads far less than last week.
        expr: |
          sum by (network, publisher, device) (rate(tracks_capture_scrapes_total{outcome="ok"}[1h]))
            < 0.4 * sum by (network, publisher, device) (rate(tracks_capture_scrapes_total{outcome="ok"}[1h] offset 1w))
        for: 2h
        labels:
          tier: chat
        annotations:
          summary: '{{ $labels.network }} {{ $labels.publisher }} ({{ $labels.device }}) has answered with ads 60% less than last week for 2 hours.'
          resolved: '{{ $labels.network }} {{ $labels.publisher }} ({{ $labels.device }}) is answering with ads at its usual rate again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/publisher-quiet.md

      # tracks-walker: landing pages of the ads capture sees. Its walks have
      # a series only after the first one, hence the vector(0).
      - alert: WalkerStopped
        expr: (sum(rate(tracks_walker_walks_total[15m])) or vector(0)) == 0
        for: 15m
        labels:
          tier: chat
        annotations:
          summary: tracks-walker has walked no landing page for 30 minutes.
          resolved: tracks-walker is walking landing pages again.
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/walker-stopped.md

      # Usually 5 to 10% of walks fail (landing pages refusing us); 36% did
      # for an hour on 1 Oct 2026.
      - alert: WalkerFailing
        expr: |
          sum by (box) (rate(tracks_walker_walks_total{outcome!="ok"}[1h]))
            / sum by (box) (rate(tracks_walker_walks_total[1h])) > 0.2
        for: 30m
        labels:
          tier: chat
        annotations:
          summary: '{{ $value | humanizePercentage }} of walks on the {{ $labels.box }} box failed in the last hour (pages refusing, proxy lines blocked, or timeouts).'
          resolved: 'Walks on the {{ $labels.box }} box fail at their usual rate again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/walker-failing.md

      # An ad waiting a whole extra re-walk (6 h) past its turn: the walker
      # cannot keep up. 1,532 ads were overdue, the oldest by 27 hours, on 2
      # Oct 2026. tracks_walker_oldest_overdue_seconds comes from
      # tracks-walker; until it reports it, this stays silent.
      - alert: WalkerBehind
        expr: max by (box) (tracks_walker_oldest_overdue_seconds) > 6 * 3600
        for: 30m
        labels:
          tier: chat
        annotations:
          summary: 'An ad has waited {{ $value | humanizeDuration }} past its re-walk on the {{ $labels.box }} box. tracks-walker is not keeping up.'
          resolved: 'tracks-walker on the {{ $labels.box }} box is keeping up with its re-walks again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/walker-behind.md

      - alert: ShipperBehind
        expr: max by (box) (tracks_shipper_oldest_unshipped_seconds) > 900
        for: 5m
        labels:
          tier: chat
        annotations:
          summary: 'The {{ $labels.box }} box has a sealed raw file waiting {{ $value | humanizeDuration }} to be archived.'
          resolved: 'The {{ $labels.box }} box has archived its waiting raw files.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/shipper-behind.md

      - alert: LoaderLag
        expr: max(tracks_loader_lag_seconds) > 600
        for: 5m
        labels:
          tier: chat
        annotations:
          summary: 'The loader is {{ $value | humanizeDuration }} behind capture.'
          resolved: 'The loader has caught up with capture.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/loader-lag.md

      - alert: RawFileQuarantined
        expr: max(tracks_loader_files_quarantined) > 0
        labels:
          tier: chat
        annotations:
          summary: '{{ $value }} raw file(s) are quarantined and wait for a fix and a replay.'
          resolved: 'No raw files are quarantined any more.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/raw-file-quarantined.md

      # Only while tracks-bridge runs (platform/SWITCH-OVER.md): today's Spy
      # reads the collector's database, which only the bridge feeds.
      - alert: BridgeBehind
        expr: max(tracks_bridge_lag_seconds) > 900
        for: 5m
        labels:
          tier: chat
        annotations:
          summary: 'Today''s Spy is {{ $value | humanizeDuration }} behind: tracks-bridge has not written the newest scrapes into the collector''s database.'
          resolved: 'tracks-bridge has caught up: today''s Spy has the newest scrapes.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/bridge-behind.md

      - alert: BridgeFileQuarantined
        expr: max(tracks_bridge_files_quarantined) > 0
        labels:
          tier: chat
        annotations:
          summary: '{{ $value }} raw file(s) could not be written into the collector''s database; today''s Spy is missing them.'
          resolved: 'No raw files are waiting to be written into the collector''s database any more.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/bridge-behind.md

      - alert: FormatDrift
        expr: |
          sum by (network) (rate(tracks_loader_scrapes_total{outcome="unparsed"}[30m]))
            / sum by (network) (rate(tracks_loader_scrapes_total[30m])) > 0.02
        for: 30m
        labels:
          tier: chat
        annotations:
          summary: '{{ $value | humanizePercentage }} of {{ $labels.network }} answers no longer parse. The feed format may have changed.'
          resolved: '{{ $labels.network }} answers parse normally again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/format-drift.md

      - alert: HourNotClosed
        # Hour H closes at about H+1:05, so the newest closed hour starts
        # at most about 2 hours ago.
        expr: time() - max(tracks_loader_last_closed_hour_timestamp_seconds) > 9000
        for: 10m
        labels:
          tier: chat
        annotations:
          summary: 'The newest closed hour started {{ $value | humanizeDuration }} ago. Hourly counts are late.'
          resolved: 'Hourly counts are on time again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/hour-not-closed.md
