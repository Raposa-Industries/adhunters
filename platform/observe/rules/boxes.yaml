# Host alerts (Alloy's node metrics, job="node"), Postgres (job="postgres")
# and how many series the boxes send to Grafana Cloud.
groups:
  - name: boxes
    interval: 1m
    rules:
      - alert: BoxGone
        # A box that sent metrics in the last day but none now: it is down,
        # cut off, or its Alloy stopped.
        expr: |
          group by (box) (max_over_time(node_boot_time_seconds[1d]))
            unless group by (box) (node_boot_time_seconds)
        for: 3m
        labels:
          tier: page
        annotations:
          summary: 'The {{ $labels.box }} box has sent no metrics for over 5 minutes.'
          resolved: 'The {{ $labels.box }} box is sending metrics again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/box-gone.md

      - alert: DiskFullSoon
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 6 * 3600) < 0
            and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.25
        for: 30m
        labels:
          tier: page
        annotations:
          summary: '{{ $labels.mountpoint }} on the {{ $labels.box }} box will be full within 6 hours at the current rate.'
          resolved: '{{ $labels.mountpoint }} on the {{ $labels.box }} box is no longer filling fast enough to be full within 6 hours.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/disk-full-soon.md

      - alert: DiskFilling
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 15m
        labels:
          tier: chat
        annotations:
          summary: '{{ $labels.mountpoint }} on the {{ $labels.box }} box has {{ $value | humanizePercentage }} free.'
          resolved: '{{ $labels.mountpoint }} on the {{ $labels.box }} box has enough free space again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/disk-filling.md

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 15m
        labels:
          tier: chat
        annotations:
          summary: 'The {{ $labels.box }} box has {{ $value | humanizePercentage }} of its memory free.'
          resolved: 'The {{ $labels.box }} box has enough free memory again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/memory-low.md

      - alert: OutOfMemoryKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        labels:
          tier: chat
        annotations:
          summary: 'The kernel killed a process for memory on the {{ $labels.box }} box.'
          resolved: 'No more out-of-memory kills on the {{ $labels.box }} box.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/out-of-memory-kill.md

      # Every unit of ours, one-off systemd-run jobs (run-u*) included: six
      # failed spy-numbers runs sat unnoticed on the data box on 2 Oct 2026
      # because Alloy watched only the tracks, raposa and postgres units.
      - alert: UnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          tier: chat
        annotations:
          summary: '{{ $labels.name }} has failed on the {{ $labels.box }} box.'
          resolved: '{{ $labels.name }} on the {{ $labels.box }} box is no longer failed.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/unit-failed.md

  - name: postgres
    interval: 1m
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 3m
        labels:
          tier: page
        annotations:
          summary: Postgres on the data box is not answering.
          resolved: Postgres on the data box is answering again.
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/postgres-down.md

      # A restart too short for PostgresDown (4 s on 2 Oct 2026, when
      # unattended-upgrades updated libssl and needrestart restarted
      # everything using it). Every service loses its connections, so error
      # lines around it are expected; this says why they happened.
      - alert: PostgresRestarted
        expr: changes(node_systemd_unit_start_time_seconds{name=~"postgresql@.+\\.service"}[70m]) > 0
        labels:
          tier: chat
        annotations:
          summary: 'Postgres ({{ $labels.name }}) on the {{ $labels.box }} box restarted in the last hour. Services lost their connections for a few seconds and logged errors.'
          resolved: 'No Postgres restart on the {{ $labels.box }} box in the last hour.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/postgres-restarted.md

      - alert: PostgresConnections
        # max_connections is 80 (platform/servers/setup.sh).
        expr: sum(pg_stat_activity_count) > 70
        for: 10m
        labels:
          tier: chat
        annotations:
          summary: 'Postgres has {{ $value }} connections open, near its limit of 80.'
          resolved: 'Postgres connections are back under the warning level.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/postgres-connections.md

  - name: backups
    interval: 1m
    rules:
      - alert: WalArchiveFailing
        # Archiving is failing and the newest archived WAL file is over 15
        # minutes old: a data box lost now would lose those minutes.
        expr: |
          increase(pg_stat_archiver_failed_count[15m]) > 0
            and pg_stat_archiver_last_archive_age > 900
        labels:
          tier: page
        annotations:
          summary: WAL archiving is failing and the newest archived WAL file is over 15 minutes old. Recent changes exist only on the data box.
          resolved: WAL archiving is working again.
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/wal-archive-failing.md

      - alert: BackupLate
        # Backups run daily at 03:30 UTC; 26 hours leaves room for a slow one.
        expr: time() - max(pgbackrest_last_backup_timestamp_seconds) > 26 * 3600
        labels:
          tier: page
        annotations:
          summary: 'The newest database backup finished {{ $value | humanizeDuration }} ago.'
          resolved: 'A new database backup has finished.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/backup-late.md

      - alert: BackupRepoUnreadable
        expr: max(pgbackrest_info_ok) == 0
        for: 30m
        labels:
          tier: chat
        annotations:
          summary: pgBackRest cannot read the backup repository, or reports the stanza unhealthy.
          resolved: pgBackRest can read the backup repository again.
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/backup-late.md

  - name: grafana
    interval: 5m
    rules:
      # Grafana Cloud's free plan holds 10,000 series and drops what goes
      # over, new metrics and the alerts that need them included
      # (platform/observe/README.md, Series). Every scrape runs every 60 s,
      # so the samples the boxes send in a minute are the series they send.
      # Not prometheus_remote_write_wal_storage_active_series: it keeps a
      # series a box stopped sending until the WAL is truncated, every 2
      # hours, and read 10,234 on the data box after the 2 Oct 2026 cut.
      - alert: SeriesNearLimit
        expr: sum(rate(prometheus_remote_storage_samples_total[10m])) * 60 > 9000
        for: 30m
        labels:
          tier: chat
        annotations:
          summary: 'Our boxes send {{ $value | printf "%.0f" }} series to Grafana Cloud. The free plan drops what goes over 10,000.'
          resolved: 'The boxes send under 9,000 series to Grafana Cloud again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/series-near-limit.md
