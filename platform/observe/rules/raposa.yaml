groups:
  - name: raposa
    interval: 1m
    rules:
      - alert: RaposaBrowserDown
        expr: sum(rate(raposa_keeps_total{result="runner_down"}[15m])) > 0
        for: 15m
        labels:
          tier: chat
        annotations:
          summary: Raposa's keeper has found the browser runner down for 15 minutes.
          resolved: Raposa's browser runner is up again.
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/raposa-browser-down.md

      - alert: WatchDeliveryFailing
        expr: sum(increase(raposa_watch_deliveries_total{status="failed"}[30m])) > 0
        labels:
          tier: chat
        annotations:
          summary: '{{ $value | humanize }} watch event(s) could not be posted to the ops group on Telegram in the last 30 minutes.'
          resolved: 'Watch events reach the ops group again.'
          runbook_url: https://github.com/Raposa-Industries/adhunters/blob/main/runbooks/watch-delivery-failing.md
