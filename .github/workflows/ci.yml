name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # Blacksmith runners need the Blacksmith GitHub app on the org, or jobs
    # wait for a runner that never comes.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      PG_TEST_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: useblacksmith/setup-go@v6
        with:
          go-version-file: go.work
      - name: gofmt
        run: |
          out=$(gofmt -l $(go list -m -f '{{.Dir}}'))
          if [ -n "$out" ]; then echo "run gofmt on:"; echo "$out"; exit 1; fi
      - name: walls
        run: ./scripts/check-walls.sh
      - name: vet and test every module
        run: |
          for dir in $(go list -m -f '{{.Dir}}'); do
            echo "::group::$dir"
            (cd "$dir" && go vet ./... && go test -race -count=1 ./...)
            echo "::endgroup::"
          done

  # The path test (e2e/README.md): one ad from Spy to Intel through the real
  # binaries, with fakes for Taboola, OpenAI and Drive. The go job skips it.
  e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      PG_TEST_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      E2E: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: useblacksmith/setup-go@v6
        with:
          go-version-file: go.work
      - name: path test (Spy, Create, library, Launch, Intel)
        working-directory: e2e
        run: go test -count=1 -v -run TestFirstCampaignPath ./...

  web:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 22
      - name: shared ad page code tests (pairing, checks, bulk sheet)
        run: node --test shared/adsweb/test/*.test.js
      - name: frame tests
        run: node --test shared/frame/test/*.test.js
      - name: launch page script tests (pairs, edited ads, mobile settings)
        run: node --test launch/web/test/*.test.js
      - name: funnels page script tests
        run: node --test funnels/web/test/*.test.js

  terraform:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: platform/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - run: terraform fmt -check -recursive ..
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  observe:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      PROMETHEUS_VERSION: 3.7.1
      ALERTMANAGER_VERSION: 0.28.1
      ALLOY_VERSION: 1.20.1
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz" | tar xz
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v$ALERTMANAGER_VERSION/alertmanager-$ALERTMANAGER_VERSION.linux-amd64.tar.gz" | tar xz
          curl -fsSLo alloy.zip "https://github.com/grafana/alloy/releases/download/v$ALLOY_VERSION/alloy-linux-amd64.zip" && unzip -q alloy.zip
          mv prometheus-*/promtool alertmanager-*/amtool bin/ && install -m 0755 alloy-linux-amd64 bin/alloy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: alert rules, rule tests, runbooks, alertmanager config
        run: platform/observe/push.sh check
      - name: alloy config (a worker box and the data box)
        run: |
          for box in worker data; do
            dir=$(mktemp -d)
            cp platform/observe/alloy/common.alloy platform/observe/tests/services.alloy "$dir/"
            [ "$box" = data ] && cp platform/observe/alloy/postgres.alloy platform/observe/alloy/tunnel.alloy "$dir/"
            alloy validate "$dir"
          done
      - name: shell
        run: |
          bash -n platform/servers/setup.sh platform/servers/pgbackrest-metrics.sh platform/servers/deploy.sh platform/servers/deploy-box.sh platform/observe/push.sh platform/observe/daily-check.sh
          shellcheck -S warning -e SC2033 platform/servers/setup.sh platform/servers/pgbackrest-metrics.sh platform/servers/deploy.sh platform/servers/deploy-box.sh platform/observe/push.sh platform/observe/daily-check.sh
